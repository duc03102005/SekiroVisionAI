name: Windows Temporal Auto Dodge build

on:
  push:
    branches: [main, feature/capture-engine, feature/auto-dodge-mvp, feature/temporal-ai-pipeline]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate reviewed skills
        run: python tools/validate_skills.py
      - name: Create input-dependent synthetic ONNX contract fixture
        run: |
          python -m pip install numpy==2.2.6 onnx==1.18.0
          python tools/make_onnx_test_fixture.py out/testdata/temporal-fixture.onnx
      - name: Configure Windows x64
        run: cmake --preset windows-x64
      - name: Record toolchain
        shell: pwsh
        run: |
          cmake --version
          Get-Content out/build/windows-x64/CMakeCache.txt | Select-String 'CMAKE_CXX_COMPILER:|CMAKE_SYSTEM_VERSION:|CMAKE_GENERATOR_TOOLSET:'
          Get-ChildItem out/build/windows-x64/CMakeFiles -Recurse -Filter CMakeCXXCompiler.cmake | Get-Content | Select-String 'CMAKE_CXX_COMPILER_VERSION|CMAKE_CXX_COMPILER_ID'
      - name: Build native Windows capture, ONNX, recording and input
        run: cmake --build --preset windows-release --parallel
      - name: Test decisions, GPU color readback, native ORT and WIC recording
        run: ctest --preset windows-release
      - name: Launch Windows UI and input watchdog without sending input
        id: ui-smoke
        shell: pwsh
        run: |
          $mvpProcess = Start-Process -FilePath out/build/windows-x64/Release/SekiroAutoDodge.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $mvpProcess.WaitForExit(15000)) {
            Stop-Process -Id $mvpProcess.Id -Force
            throw 'MVP smoke test did not exit within 15 seconds'
          }
          $mvpProcess.Refresh()
          if ($mvpProcess.ExitCode -ne 0) { throw "MVP smoke test exit code $($mvpProcess.ExitCode)" }
      - name: Package runnable Windows app and native dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/package | Out-Null
          Copy-Item out/build/windows-x64/Release/SekiroAutoDodge.exe out/package/
          Copy-Item out/build/windows-x64/Release/*.dll out/package/
          Copy-Item docs/TEMPORAL_QUICKSTART_VI.md out/package/README_VI.md
          New-Item -ItemType Directory -Force out/package/licenses | Out-Null
          Copy-Item out/build/windows-x64/_deps/svai_ort-src/LICENSE out/package/licenses/ONNXRuntime-LICENSE.txt
          Copy-Item out/build/windows-x64/_deps/svai_ort-src/ThirdPartyNotices.txt out/package/licenses/ONNXRuntime-ThirdPartyNotices.txt
          Copy-Item out/build/windows-x64/_deps/svai_directml-src/LICENSE.txt out/package/licenses/DirectML-LICENSE.txt
          Copy-Item out/build/windows-x64/_deps/svai_directml-src/ThirdPartyNotices.txt out/package/licenses/DirectML-ThirdPartyNotices.txt
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          $crtDirectory = Get-ChildItem "$vsPath/VC/Redist/MSVC" -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'x64/Microsoft.VC143.CRT' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $crtDirectory) { throw 'App-local VC++ redistributable runtime was not found' }
          Copy-Item "$crtDirectory/*.dll" out/package/
          Copy-Item docs/runtime-dependencies.md out/package/licenses/runtime-dependencies.md
          New-Item -ItemType Directory -Force out/package/models/attack-v0.1 | Out-Null
          Copy-Item models/attack-v0.1/README.md out/package/models/attack-v0.1/README.md
          # Isolated package smoke: imports resolve entirely from packaged DLLs/Windows.
          $packagedProcess = Start-Process -FilePath out/package/SekiroAutoDodge.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $packagedProcess.WaitForExit(15000)) { Stop-Process -Id $packagedProcess.Id -Force; throw 'Packaged smoke timeout' }
          $packagedProcess.Refresh()
          if ($packagedProcess.ExitCode -ne 0) { throw "Packaged app failed: $($packagedProcess.ExitCode)" }
          $manifest = [ordered]@{
            version = '0.3.0-temporal-pipeline'
            built_commit = (git rev-parse HEAD)
            source_head = '${{ github.event.pull_request.head.sha || github.sha }}'
            architecture = 'Windows x64'
            executable_sha256 = (Get-FileHash out/package/SekiroAutoDodge.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            ui_smoke = '${{ steps.ui-smoke.outcome }}'
            live_sekiro_accuracy = 'not measured'
            runtime = 'C++20 WGC D3D11 ORT DirectML/CPU WIC SendInput'
            onnxruntime = '1.24.4 DirectML; CPU fallback explicitly reported'
            directml = '1.15.4'
            gameplay_model = 'not included: no rights-verified reviewed gameplay training data'
            packaged_smoke = 'passed'
            files = @(Get-ChildItem out/package -Recurse -File | ForEach-Object { @{ path = $_.FullName.Substring((Resolve-Path out/package).Path.Length + 1); sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } })
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding UTF8 out/package/build-manifest.json
      - name: Publish unsigned Windows Temporal Auto Dodge
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SekiroAutoDodge-Temporal-Windows-x64-${{ github.sha }}
          path: out/package/
          if-no-files-found: error
          retention-days: 30
