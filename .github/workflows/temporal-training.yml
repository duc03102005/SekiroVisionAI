name: Temporal learning and dataset tooling

on:
  push:
    branches: [main, feature/temporal-ai-pipeline]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install offline training dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          .venv/bin/python -m pip install -r requirements-training.txt
          .venv/bin/python -m pip install -r DatasetTools/requirements.txt
          ffmpeg -version
      - name: Dataset and temporal behavior tests
        run: |
          .venv/bin/python -m unittest discover -s Tests -p 'dataset_*.py'
          .venv/bin/python -m unittest discover -s Tests -p 'training_*.py'
      - name: Actual synthetic optimization, ONNX parity and three-model CPU comparison
        run: .venv/bin/python -m Training.trainers.smoke artifacts/temporal-synthetic --steps 80
      - name: Record environment
        if: always()
        run: |
          mkdir -p artifacts/temporal-synthetic
          .venv/bin/python -m pip freeze > artifacts/temporal-synthetic/environment.txt
          printf '%s\n' "$GITHUB_SHA" > artifacts/temporal-synthetic/git_commit.txt
      - name: Upload synthetic-only evidence (never a gameplay model)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SYNTHETIC-ONLY-temporal-tests-${{ github.sha }}
          path: artifacts/temporal-synthetic
          if-no-files-found: error
          retention-days: 30
